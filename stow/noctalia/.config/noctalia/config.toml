[shell]
polkit_agent = true
telemetry_enabled = false
clipboard_enabled = true
clipboard_history_max_entries = 20
clipboard_keep_from_closed_apps = true

[shell.launcher]
pinned = []

[shell.screenshot]
save_to_file = true
directory = "~/Pictures/Screenshots"
copy_to_clipboard = true
freeze_screen = true

[audio]
enable_sounds = true
sound_theme = "modern-minimal-ui-sounds"

[wallpaper]
enabled = true
directory = "/home/shinobiaoshi/Pictures/Wallpapers/Landscape/Hatsune Miku"
fill_mode = "crop"

[wallpaper.automation]
enabled = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

# Keep the compositor and toolkit colors synchronized with Noctalia. The
# built-in Umbriel template renders noctalia.toml and maintains its include.
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "ghostty", "qt", "umbriel"]

[idle]
behavior_order = ["lock", "screen-off", "suspend"]

[idle.behavior.lock]
timeout = 0
action = "lock"
enabled = false

[idle.behavior.screen-off]
timeout = 0
action = "screen_off"
enabled = false

[idle.behavior.suspend]
timeout = 0
action = "lock_and_suspend"
enabled = false

[bar]
order = ["main"]

[bar.main]
enabled = true
position = "top"
auto_hide = true
smart_auto_hide = false
show_on_workspace_switch = true
reserve_space = false
start = ["workspaces", "active_window"]
center = ["clock"]
end = ["cpu-usage", "cpu-temp", "gpu-usage", "gpu-temp", "memory", "tray", "network", "bluetooth", "volume", "notifications", "session"]

[widget.clock]
format = "{:%-I:%M %p · %a, %b %-d}"

[widget.cpu-usage]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"

[widget.gpu-usage]
type = "sysmon"
stat = "gpu_usage"
visualization = "none"

[widget.gpu-temp]
type = "sysmon"
stat = "gpu_temp"
visualization = "none"

[widget.memory]
type = "sysmon"
stat = "ram_pct"
visualization = "none"

[dock]
enabled = true
position = "bottom"
auto_hide = true
smart_auto_hide = false
reserve_space = false
show_running = true
pinned = ["org.gnome.Nautilus", "com.mitchellh.ghostty", "brave-origin", "vesktop", "steam"]

[notification]
enable_daemon = true
position = "top_right"
keep_dismissed_in_history = true
filter_order = [
    "waydroid-01",
    "waydroid-02",
    "waydroid-03",
    "waydroid-04",
    "waydroid-05",
    "waydroid-06",
    "waydroid-07",
    "waydroid-08",
    "waydroid-09",
    "waydroid-10",
    "waydroid-11",
    "waydroid-12",
    "waydroid-13",
    "waydroid-14",
    "waydroid-15",
    "waydroid-16",
    "waydroid-17",
    "waydroid-18",
    "waydroid-19",
    "waydroid-20",
    "waydroid-21",
    "waydroid-22",
    "standard-duration",
]

