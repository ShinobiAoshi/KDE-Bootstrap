[notification.filter.standard-duration]
enabled = true
match_content = ".*"
show_toast = true
save_history = true
play_sound = true
allow_permanent = false
override_duration = 5000

[system.monitor]
enabled = true

[weather]
enabled = true
refresh_minutes = 30
unit = "imperial"

[location]
auto_locate = false
address = "Austin, TX"

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 2700

[calendar]
enabled = false
refresh_minutes = 15

[calendar.account.google]
type = "google"
name = "Google"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "audio"

[[control_center.shortcuts]]
type = "session"

# Noctalia does not expose a session-only clipboard-history setting. Clearing
# unpinned entries at shell startup prevents history from carrying across a
# reboot or shell restart while preserving Secret Service for Google Calendar.
[hooks]
started = "noctalia msg clipboard-clear"
